spring.application.name=tienda-decroly
spring.profiles.active=dev

# Errores que genera Spring (JSON mal escrito, 415...) tambien como ProblemDetail
spring.mvc.problemdetails.enabled=true

# Configuracion propia de la tienda
tienda.nombre=Tienda Decroly
tienda.iva=21
tienda.envio-gratis-desde=50
# Origen de los productos: memoria, json o jpa
tienda.productos.origen=jpa

# APIs externas
apis.catalogo-url=https://dummyjson.com
apis.divisas-url=https://api.frankfurter.dev/v1
apis.timeout-segundos=3
